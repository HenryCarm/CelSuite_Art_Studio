name: CelSuite Art Studio Multi-Platform Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONIOENCODING: utf-8

jobs:
  build:
    name: Build ${{ matrix.platform }} (${{ matrix.variant }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 1. Linux Universal (PyTorch CPU - All CPUs)
          - os: ubuntu-latest
            platform: Linux
            variant: Universal
            engine: pytorch
          # 2. Linux Intel (stable-diffusion.cpp - Ultra-Light AVX2)
          - os: ubuntu-latest
            platform: Linux
            variant: Intel
            engine: sdcpp
          # 3. Windows Universal (PyTorch CPU - All CPUs)
          - os: windows-latest
            platform: Windows
            variant: Universal
            engine: pytorch
          # 4. Windows Intel (stable-diffusion.cpp - Ultra-Light AVX2)
          - os: windows-latest
            platform: Windows
            variant: Intel
            engine: sdcpp

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Windows C++ Build Tools
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Linux Build Dependencies & 7z
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache clang p7zip-full

      - name: Install Dependencies (PyTorch Universal Engine)
        if: matrix.engine == 'pytorch'
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install nuitka zstandard

      - name: Install Dependencies (Intel SD.cpp Engine)
        if: matrix.engine == 'sdcpp'
        run: |
          python -m pip install --upgrade pip
          pip install stable-diffusion-cpp-python
          pip install PySide6 Pillow packaging requests tqdm
          pip install nuitka zstandard

      - name: Build Standalone Distribution (.zip and .7z)
        run: |
          python build_nuitka.py --variant=${{ matrix.variant }}

      - name: Upload Release Artifacts
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: CelSuite Art Studio - Liquid Glass Yellow Edition ${{ github.ref_name }}
          body: |
            <div align="center">
            <img src="https://raw.githubusercontent.com/HenryCarm/CelSuite_Art_Studio/main/banner.webp" width="100%" style="border-radius: 14px; max-width: 820px;" />
            </div>

            # CelSuite Art Studio — Release ${{ github.ref_name }}

            Official multi-platform offline generative AI studio featuring Liquid Glass Yellow design, multi-threaded CPU acceleration, and instant zero-setup inference.

            ---

            ## Downloads

            Choose between the **Universal Edition** (Hugging Face Diffusers + PyTorch CPU for all AMD and Intel processors) and the **Intel Edition** (Ultra-lightweight pure C++ `stable-diffusion.cpp` engine with AVX2 acceleration).

            | Platform | Edition | Format | Compression | Download |
            | :--- | :--- | :--- | :--- | :--- |
            | 🐧 **Linux** | Universal (All CPUs) | `.zip` | Standard Deflate | [Download](https://github.com/HenryCarm/CelSuite_Art_Studio/releases/download/${{ github.ref_name }}/CelSuite_ArtStudio-Linux-Universal.zip) |
            | 🐧 **Linux** | Universal (All CPUs) | `.7z` | Ultra LZMA2 | [Download](https://github.com/HenryCarm/CelSuite_Art_Studio/releases/download/${{ github.ref_name }}/CelSuite_ArtStudio-Linux-Universal.7z) |
            | 🐧 **Linux** | Intel (AVX2 Ultra-Light) | `.zip` | Standard Deflate | [Download](https://github.com/HenryCarm/CelSuite_Art_Studio/releases/download/${{ github.ref_name }}/CelSuite_ArtStudio-Linux-Intel.zip) |
            | 🐧 **Linux** | Intel (AVX2 Ultra-Light) | `.7z` | Ultra LZMA2 | [Download](https://github.com/HenryCarm/CelSuite_Art_Studio/releases/download/${{ github.ref_name }}/CelSuite_ArtStudio-Linux-Intel.7z) |
            | 🪟 **Windows** | Universal (All CPUs) | `.zip` | Standard Deflate | [Download](https://github.com/HenryCarm/CelSuite_Art_Studio/releases/download/${{ github.ref_name }}/CelSuite_ArtStudio-Windows-Universal.zip) |
            | 🪟 **Windows** | Universal (All CPUs) | `.7z` | Ultra LZMA2 | [Download](https://github.com/HenryCarm/CelSuite_Art_Studio/releases/download/${{ github.ref_name }}/CelSuite_ArtStudio-Windows-Universal.7z) |
            | 🪟 **Windows** | Intel (AVX2 Ultra-Light) | `.zip` | Standard Deflate | [Download](https://github.com/HenryCarm/CelSuite_Art_Studio/releases/download/${{ github.ref_name }}/CelSuite_ArtStudio-Windows-Intel.zip) |
            | 🪟 **Windows** | Intel (AVX2 Ultra-Light) | `.7z` | Ultra LZMA2 | [Download](https://github.com/HenryCarm/CelSuite_Art_Studio/releases/download/${{ github.ref_name }}/CelSuite_ArtStudio-Windows-Intel.7z) |

            ---
            *Built with Nuitka & PySide6 LGPL.*
          files: |
            dist/*.zip
            dist/*.7z
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
